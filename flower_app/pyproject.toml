
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seniorproject-fl"
version = "0.1.0"
description = "Non-IID Federated Learning for IIoT cyberattack classification"
requires-python = ">=3.12"
dependencies = [
    "flwr[simulation]>=1.40.0,<1.41.0",
    "torch",
    "numpy",
    "pandas",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["seniorfl"]

[tool.flwr.app]
publisher = "seniorproject"

[tool.flwr.app.components]
serverapp = "seniorfl.server_app:app"
clientapp = "seniorfl.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 15
local-epochs = 1
batch-size = 128
learning-rate = 0.001


